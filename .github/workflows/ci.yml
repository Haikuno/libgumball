name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb python3-pil pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - name: Install backend dependencies
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg" install raylib sdl3 sdl3-image sdl3-ttf

      - name: Configure SDL3
        run: |
          cmake -S . -B build-sdl3 -G Ninja \
            -DGUM_BACKEND=SDL3 \
            -DGUM_BUILD_TESTS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build SDL3
        run: cmake --build build-sdl3 --parallel

      - name: Test SDL3
        run: ctest --test-dir build-sdl3 --output-on-failure

      - name: Configure raylib
        run: |
          cmake -S . -B build-raylib -G Ninja \
            -DGUM_BACKEND=RAYLIB \
            -DGUM_BUILD_TESTS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build raylib
        run: cmake --build build-raylib --parallel

      - name: Test raylib
        run: xvfb-run -a ctest --test-dir build-raylib --output-on-failure

      - name: Render backend parity scenes
        run: |
          mkdir -p parity-output
          build-sdl3/tests/GumballBackendParity parity-output/sdl3.bmp
          xvfb-run -a build-raylib/tests/GumballBackendParity parity-output/raylib.bmp

      - name: Compare backend output
        run: python3 tests/parity/compare_images.py parity-output/sdl3.bmp parity-output/raylib.bmp parity-output/diff.png

      - name: Upload parity failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-parity
          path: parity-output/
